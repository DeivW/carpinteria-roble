<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carpintería El Roble - Simulador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; }

        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            font-size: 1.3em;
            font-weight: bold;
        }

        .panel-params {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .panel-params h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
        }

        .params-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .param-item { display: flex; flex-direction: column; gap: 4px; }
        .param-item label { font-size: 0.85em; font-weight: bold; color: #555; }
        .param-item input {
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
            width: 160px;
        }

        .btn-simular {
            padding: 8px 25px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            height: 35px;
        }
        .btn-simular:hover { background: #3d5166; }

        .panel-stats {
            background: white;
            margin: 0 15px 15px 15px;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            display: none;
        }

        .panel-stats h3 { margin-bottom: 10px; color: #2c3e50; }

        .stats-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #ecf0f1;
            border-left: 4px solid #2c3e50;
            padding: 10px 15px;
            border-radius: 4px;
            min-width: 200px;
        }

        .stat-box .stat-label { font-size: 0.8em; color: #666; margin-bottom: 3px; }
        .stat-box .stat-value { font-size: 1.3em; font-weight: bold; color: #2c3e50; }

        .panel-grilla {
            background: white;
            margin: 0 15px 15px 15px;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            display: none;
        }

        .panel-grilla h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .tabla-wrapper {
            overflow-x: auto;

            border: 1px solid #ccc;
        }
        table {
            border-collapse: collapse;
            font-size: 0.78em;
            white-space: nowrap;
        }

        /* Encabezados de grupo */
        thead tr.fila-grupo th {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 5px 8px;
            border: 1px solid #1a252f;
            font-size: 0.85em;
        }

        /* Encabezados de columna */
        thead tr.fila-col th {
            background: #4a6fa5;
            color: white;
            text-align: center;
            padding: 5px 6px;
            border: 1px solid #3a5985;
            font-size: 0.78em;
        }

        /* Filas de datos */
        tbody tr:nth-child(even) { background: #f7f9fc; }
        tbody tr:hover { background: #eaf0fb; }

        tbody td {
            padding: 4px 7px;
            border: 1px solid #ddd;
            text-align: center;
            color: #333;
        }

        /* Colores por sección */
        .col-base { background-color: inherit; }
        .col-est { background-color: #fef9e7; }
        .col-med { background-color: #eafaf1; }
        .col-c1  { background-color: #eaf4fb; }
        .col-c2  { background-color: #fdf2f8; }
        .col-cola { background-color: #fdfefe; }
        .col-ayud { background-color: #fef5e4; }
        .col-stats { background-color: #f2f3f4; }
        .col-mueble { background-color: #f9f9f9; }

        /* Separador entre grupos de muebles */
        .sep-mueble { border-left: 2px solid #aaa !important; }

        /* Fila de ultima jornada */
        tr.ultima-fila td { background: #d5e8d4; font-weight: bold; }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            display: none;
        }

        .error-msg {
            color: red;
            margin-top: 10px;
            display: none;
        }

        .info-iteraciones {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
        }

        .panel-ultima {
            background: white;
            margin: 0 15px 15px 15px;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            display: none;
        }

        .panel-ultima h3 { margin-bottom: 10px; color: #2c3e50; }
    </style>
</head>
<body>

<div class="header">CARPINTERIA EL ROBLE - SIMULADOR</div>

<!-- PARÁMETROS -->
<div class="panel-params">
    <h3>Parámetros de Simulación</h3>
    <div class="params-grid">
        <div class="param-item">
            <label>Tiempo máximo en Horas</label>
            <input type="number" id="calcResultado" value="8" min="1">
            <button class="btn-horas" onclick="usarEnHoraDesde()">Calcular</button>
            <label>Tiempo máximo en minutos</label>
            <input type="number" id="tiempoMaximo" value="480" min="1">
        </div>
        <div class="param-item">
            <label>Iteraciones a mostrar</label>
            <input type="number" id="iteracionesAMostrar" value="200" min="1" max="100000">
        </div>
        <div class="param-item">
            <label>Mostrar desde (minutos)</label>
            <input type="number" id="horaDesde" value="0" min="0">
        </div>
        <div class="param-item">
            <label>Media de llegada Muebles Estandar</label>
            <input type="number" id="mediaEst" value="120" min="0">
        </div>
        <div class="param-item">
            <label>Media de llegada Muebles a Medida</label>
            <input type="number" id="mediaMed" value="300" min="0">
        </div>
        <div class="param-item">
            <label>Fabricación estandar entre:</label>
            <input type="number" id="fabEstDesde" value="60" min="0">
            <input type="number" id="fabEstHasta" value="100" min="0">
        </div>
        <div class="param-item">
            <label>Fabricación a medida entre:</label>
            <input type="number" id="fabMedDesde" value="120" min="0">
            <input type="number" id="fabMedHasta" value="240" min="0">
        </div>
        <div class="param-item">
            <label>Media de barnizado</label>
            <input type="number" id="mediaBarn" value="45" min="0">
        </div>
        <div class="param-item">
            <button class="btn-simular" onclick="ejecutarSimulacion()">SIMULAR</button>
        </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
</div>

<div class="loading" id="loading"> Ejecutando simulación...</div>

<!-- ESTADÍSTICAS FINALES -->
<div class="panel-stats" id="panelStats">
    <h3>Estadísticas Finales</h3>
    <div class="stats-grid" id="statsGrid"></div>
</div>

<!-- ÚLTIMA FILA -->
<div class="panel-ultima" id="panelUltima">
    <h3>⏱ Última fila — Instante final (t = <span id="tiempoFinal"></span> min)</h3>
    <div class="tabla-wrapper">
        <table id="tablaUltima"></table>
    </div>
</div>

<!-- GRILLA PRINCIPAL -->
<div class="panel-grilla" id="panelGrilla">
    <h3>Vector de Estados</h3>
    <div class="info-iteraciones" id="infoIteraciones"></div>
    <div class="tabla-wrapper">
        <table id="tablaVector"></table>
    </div>
</div>

<script>
    function usarEnHoraDesde() {
    const total = document.getElementById('calcResultado').value;
    document.getElementById('tiempoMaximo').value = total*60;
    }
    async function ejecutarSimulacion() {
        const tiempoMaximo = parseFloat(document.getElementById('tiempoMaximo').value);
        const iteracionesAMostrar = parseInt(document.getElementById('iteracionesAMostrar').value);
        const horaDesde = parseFloat(document.getElementById('horaDesde').value);
        const mediaEst = parseFloat(document.getElementById("mediaEst").value);
        const mediaMed = parseFloat(document.getElementById("mediaMed").value);
        const fabEstDesde = parseFloat(document.getElementById("fabEstDesde").value);
        const fabEstHasta = parseFloat(document.getElementById("fabEstHasta").value);
        const fabMedDesde = parseFloat(document.getElementById("fabMedDesde").value);
        const fabMedHasta = parseFloat(document.getElementById("fabMedHasta").value);
        const mediaBarn = parseFloat(document.getElementById("mediaBarn").value);

        if (isNaN(tiempoMaximo) || tiempoMaximo <= 0) {
            mostrarError('El tiempo máximo debe ser mayor a 0.');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('panelStats').style.display = 'none';
        document.getElementById('panelGrilla').style.display = 'none';
        document.getElementById('panelUltima').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';

        try {
            const resp = await fetch('/api/simular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tiempoMaximo, iteracionesAMostrar, horaDesde, mediaEst, mediaMed, fabEstDesde, fabEstHasta, fabMedDesde, fabMedHasta, mediaBarn })
            });

            if (!resp.ok) throw new Error('Error en el servidor');
            const data = await resp.json();

            mostrarEstadisticas(data);
            mostrarGrilla(data);
            mostrarUltimaFila(data);

        } catch (e) {
            mostrarError('Error al ejecutar la simulación: ' + e.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function fmt(val, decimals = 2) {
        if (val === null || val === undefined) return '';
        if (typeof val === 'number') return val.toFixed(decimals);
        return val;
    }

    function mostrarEstadisticas(data) {
        const panel = document.getElementById('panelStats');
        const grid = document.getElementById('statsGrid');

        grid.innerHTML = `
            <div class="stat-box">
                <div class="stat-label">Tiempo promedio de espera en cola - Muebles estándar</div>
                <div class="stat-value">${fmt(data.promedioEsperaEstandar)} min</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Tiempo promedio de espera en cola - Muebles a medida</div>
                <div class="stat-value">${fmt(data.promedioEsperaMedida)} min</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Porcentaje de la jornada bloqueado - Carpintero 1</div>
                <div class="stat-value">${fmt(data.porcentajeBloqueoCarpintero1)} %</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Porcentaje de la jornada bloqueado - Carpintero 2</div>
                <div class="stat-value">${fmt(data.porcentajeBloqueoCarpintero2)} %</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Muebles en sistema al finalizar</div>
                <div class="stat-value">${data.mueblesEnSistemaAlFinal}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total iteraciones generadas</div>
                <div class="stat-value">${data.totalIteraciones}</div>
            </div>
        `;
        panel.style.display = 'block';
    }

    function construirTabla(filas, mostrarMuebles) {
        if (!filas || filas.length === 0) return '<p>Sin filas para mostrar.</p>';

        // 1. Identificar TODOS los IDs únicos de muebles que aparecen en estas filas
        let idsMueblesUnicos = [];
        if (mostrarMuebles) {
            let setIds = new Set();
            filas.forEach(f => {
                if (f.mueblesVivos) {
                    f.mueblesVivos.forEach(m => setIds.add(m.id));
                }
            });
            // Ordenamos numéricamente para que la grilla sea predecible de izquierda a derecha
            idsMueblesUnicos = Array.from(setIds).sort((a, b) => a - b);
        }

        const maxMuebles = idsMueblesUnicos.length;

        // --- ENCABEZADOS DE GRUPO (Fila 1 del Thead) ---
        let thGrupo = '<tr class="fila-grupo">';
        thGrupo += '<th colspan="5">Base</th>';
        thGrupo += '<th colspan="3">Llegada Estándar</th>';
        thGrupo += '<th colspan="3">Llegada A Medida</th>';
        thGrupo += '<th colspan="7">Carpintero 1</th>';
        thGrupo += '<th colspan="7">Carpintero 2</th>';
        thGrupo += '<th colspan="2">Colas</th>';
        thGrupo += '<th colspan="4">Ayudante Barniz</th>';
        thGrupo += '<th colspan="9">Estadísticas</th>';

        // Muebles vivos: Una sección de 4 columnas por cada ID único real
        if (mostrarMuebles && maxMuebles > 0) {
            idsMueblesUnicos.forEach(id => {
                thGrupo += `<th colspan="4">Mueble ID ${id}</th>`;
            });
        }
        thGrupo += '</tr>';

        // --- ENCABEZADOS DE COLUMNA (Fila 2 del Thead) ---
        let thCol = '<tr class="fila-col">';
        thCol += '<th class="col-base">Iteración</th>';
        thCol += '<th class="col-base">Evento</th>';
        thCol += '<th class="col-base">Reloj</th>';
        thCol += '<th class="col-base">ID Mueble</th>';
        thCol += '<th class="col-base">Próx. ID</th>';
        thCol += '<th class="col-est">RND</th>';
        thCol += '<th class="col-est">T Entre</th>';
        thCol += '<th class="col-est">Próx Llegada</th>';
        thCol += '<th class="col-med">RND</th>';
        thCol += '<th class="col-med">T Entre</th>';
        thCol += '<th class="col-med">Próx Llegada</th>';
        thCol += '<th class="col-c1">Estado</th>';
        thCol += '<th class="col-c1">Mueble</th>';
        thCol += '<th class="col-c1">RND Fab</th>';
        thCol += '<th class="col-c1">T Fab</th>';
        thCol += '<th class="col-c1">Fin Fab</th>';
        thCol += '<th class="col-c1">Ini Bloq</th>';
        thCol += '<th class="col-c1">Fin Bloq</th>';
        thCol += '<th class="col-c2">Estado</th>';
        thCol += '<th class="col-c2">Mueble</th>';
        thCol += '<th class="col-c2">RND Fab</th>';
        thCol += '<th class="col-c2">T Fab</th>';
        thCol += '<th class="col-c2">Fin Fab</th>';
        thCol += '<th class="col-c2">Ini Bloq</th>';
        thCol += '<th class="col-c2">Fin Bloq</th>';
        thCol += '<th class="col-cola">Cola EST</th>';
        thCol += '<th class="col-cola">Cola MED</th>';
        thCol += '<th class="col-ayud">Estado</th>';
        thCol += '<th class="col-ayud">RND</th>';
        thCol += '<th class="col-ayud">T Barn</th>';
        thCol += '<th class="col-ayud">Fin Barn</th>';
        thCol += '<th class="col-stats">Cnt EST</th>';
        thCol += '<th class="col-stats">Esp EST</th>';
        thCol += '<th class="col-stats">Acum Esp EST</th>';
        thCol += '<th class="col-stats">Cnt MED</th>';
        thCol += '<th class="col-stats">Esp MED</th>';
        thCol += '<th class="col-stats">Acum Esp MED</th>';
        thCol += '<th class="col-stats">Bloq Act</th>';
        thCol += '<th class="col-stats">Acum Bloq</th>';
        thCol += '<th class="col-stats">En Sistema</th>';

        // CORRECCIÓN CRÍTICA: Iteramos sobre la lista de IDs reales, garantizando sincronía total con thGrupo
        if (mostrarMuebles && maxMuebles > 0) {
            idsMueblesUnicos.forEach(() => {
                thCol += '<th class="col-mueble sep-mueble">ID</th>';
                thCol += '<th class="col-mueble">Tipo</th>';
                thCol += '<th class="col-mueble">Estado</th>';
                thCol += '<th class="col-mueble">T Llegada</th>';
            });
        }
        thCol += '</tr>';

        // --- FILAS DE DATOS (Tbody) ---
        let tbody = '';
        filas.forEach(f => {
            const esUltima = f.evento === 'fin jornada';
            tbody += `<tr class="${esUltima ? 'ultima-fila' : ''}">`;
            tbody += `<td class="col-base">${f.iteracion || ''}</td>`;
            tbody += `<td class="col-base">${f.evento || ''}</td>`;
            tbody += `<td class="col-base">${fmt(f.reloj)}</td>`;
            tbody += `<td class="col-base">${f.idMueble !== null && f.idMueble !== undefined ? f.idMueble : ''}</td>`;
            tbody += `<td class="col-base">${f.idProximoMueble !== null && f.idProximoMueble !== undefined ? f.idProximoMueble : ''}</td>`;
            tbody += `<td class="col-est">${fmt(f.rndEstandar)}</td>`;
            tbody += `<td class="col-est">${fmt(f.tiempoEntreEstandar)}</td>`;
            tbody += `<td class="col-est">${fmt(f.proximaLlegadaEstandar)}</td>`;
            tbody += `<td class="col-med">${fmt(f.rndMedida)}</td>`;
            tbody += `<td class="col-med">${fmt(f.tiempoEntreMedida)}</td>`;
            tbody += `<td class="col-med">${fmt(f.proximaLlegadaMedida)}</td>`;
            tbody += `<td class="col-c1">${f.estadoCarpintero1 || ''}</td>`;
            tbody += `<td class="col-c1">${f.muebleCarpintero1 !== null && f.muebleCarpintero1 !== undefined ? f.muebleCarpintero1 : ''}</td>`;
            tbody += `<td class="col-c1">${fmt(f.rndFabCarpintero1)}</td>`;
            tbody += `<td class="col-c1">${fmt(f.tiempoFabCarpintero1)}</td>`;
            tbody += `<td class="col-c1">${fmt(f.finFabCarpintero1)}</td>`;
            tbody += `<td class="col-c1">${fmt(f.inicioBloqueoC1)}</td>`;
            tbody += `<td class="col-c1">${fmt(f.finBloqueoC1)}</td>`;
            tbody += `<td class="col-c2">${f.estadoCarpintero2 || ''}</td>`;
            tbody += `<td class="col-c2">${f.muebleCarpintero2 !== null && f.muebleCarpintero2 !== undefined ? f.muebleCarpintero2 : ''}</td>`;
            tbody += `<td class="col-c2">${fmt(f.rndFabCarpintero2)}</td>`;
            tbody += `<td class="col-c2">${fmt(f.tiempoFabCarpintero2)}</td>`;
            tbody += `<td class="col-c2">${fmt(f.finFabCarpintero2)}</td>`;
            tbody += `<td class="col-c2">${fmt(f.inicioBloqueoC2)}</td>`;
            tbody += `<td class="col-c2">${fmt(f.finBloqueoC2)}</td>`;
            tbody += `<td class="col-cola">${f.colaEstandarCantidad}</td>`;
            tbody += `<td class="col-cola">${f.colaMedidaCantidad}</td>`;
            tbody += `<td class="col-ayud">${f.estadoAyudante || ''}</td>`;
            tbody += `<td class="col-ayud">${fmt(f.rndBarnizado)}</td>`;
            tbody += `<td class="col-ayud">${fmt(f.tiempoBarnizado)}</td>`;
            tbody += `<td class="col-ayud">${fmt(f.finBarnizado)}</td>`;
            tbody += `<td class="col-stats">${f.contadorMueblesEstandar}</td>`;
            tbody += `<td class="col-stats">${fmt(f.tiempoEsperaEstandarActual)}</td>`;
            tbody += `<td class="col-stats">${fmt(f.acumEsperaEstandar)}</td>`;
            tbody += `<td class="col-stats">${f.contadorMueblesMedida}</td>`;
            tbody += `<td class="col-stats">${fmt(f.tiempoEsperaMedidaActual)}</td>`;
            tbody += `<td class="col-stats">${fmt(f.acumEsperaMedida)}</td>`;
            tbody += `<td class="col-stats">${fmt(f.tiempoBloqueoActual)}</td>`;
            tbody += `<td class="col-stats">${fmt(f.acumTiempoBloqueo)}</td>`;
            tbody += `<td class="col-stats">${f.mueblesEnSistemaAlFinal > 0 ? f.mueblesEnSistemaAlFinal : ''}</td>`;

            // Renderizado posicional exacto de los objetos temporales
            if (mostrarMuebles && maxMuebles > 0) {
                const mapaMueblesFila = {};
                if (f.mueblesVivos) {
                    f.mueblesVivos.forEach(m => { mapaMueblesFila[m.id] = m; });
                }

                idsMueblesUnicos.forEach(idMuebleColumna => {
                    const m = mapaMueblesFila[idMuebleColumna];
                    if (m) {
                        tbody += `<td class="col-mueble sep-mueble">${m.id}</td>`;
                        tbody += `<td class="col-mueble">${m.tipo}</td>`;
                        tbody += `<td class="col-mueble">${m.estado}</td>`;
                        tbody += `<td class="col-mueble">${fmt(m.tiempoLlegada)}</td>`;
                    } else {
                        tbody += `<td class="col-mueble sep-mueble"></td>`;
                        tbody += `<td class="col-mueble"></td>`;
                        tbody += `<td class="col-mueble"></td>`;
                        tbody += `<td class="col-mueble"></td>`;
                    }
                });
            }
            tbody += '</tr>';
        });

        return `<thead>${thGrupo}${thCol}</thead><tbody>${tbody}</tbody>`;
    }

    function mostrarGrilla(data) {
        const panel = document.getElementById('panelGrilla');
        const tabla = document.getElementById('tablaVector');
        const info = document.getElementById('infoIteraciones');

        const filas = data.filasAMostrar || [];
        info.textContent = `Mostrando ${filas.length} iteraciones desde el minuto ${document.getElementById('horaDesde').value}. Total generadas: ${data.totalIteraciones}.`;

        tabla.innerHTML = construirTabla(filas, true);
        panel.style.display = 'block';
    }

    function mostrarUltimaFila(data) {
        const panel = document.getElementById('panelUltima');
        const tabla = document.getElementById('tablaUltima');
        const spanTiempo = document.getElementById('tiempoFinal');

        if (!data.ultimaFila) return;

        spanTiempo.textContent = fmt(data.ultimaFila.reloj);
        // La ultima fila no tiene muebles vivos
        tabla.innerHTML = construirTabla([data.ultimaFila], false);
        panel.style.display = 'block';
    }

    function mostrarError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }
</script>
</body>
</html>
